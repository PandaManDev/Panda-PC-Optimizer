name: Build and Release Panda PC Optimizer EXE and Installer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Prepare Panda app icon
        shell: python
        run: |
          from PIL import Image, ImageDraw
          size = 256
          image = Image.new("RGBA", (size, size), (18, 10, 34, 255))
          draw = ImageDraw.Draw(image)
          draw.ellipse((12, 12, 244, 244), outline=(151, 75, 255, 255), width=10)
          draw.ellipse((25, 25, 231, 231), outline=(50, 220, 255, 210), width=4)
          draw.rounded_rectangle((46, 53, 210, 205), radius=62, fill=(238, 241, 255, 255), outline=(90, 55, 160, 255), width=5)
          draw.ellipse((42, 45, 100, 104), fill=(25, 18, 40, 255))
          draw.ellipse((156, 45, 214, 104), fill=(25, 18, 40, 255))
          draw.ellipse((72, 91, 126, 143), fill=(25, 18, 40, 255))
          draw.ellipse((130, 91, 184, 143), fill=(25, 18, 40, 255))
          draw.ellipse((89, 105, 108, 124), fill=(60, 225, 255, 255))
          draw.ellipse((148, 105, 167, 124), fill=(60, 225, 255, 255))
          draw.ellipse((117, 135, 139, 153), fill=(25, 18, 40, 255))
          draw.arc((92, 135, 164, 184), start=10, end=170, fill=(25, 18, 40, 255), width=5)
          image.save("panda_logo.ico", format="ICO", sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon=panda_logo.ico --name "Panda PC Optimizer" main.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
      - name: Upload Windows builds as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Panda-PC-Optimizer-Windows-Installer-and-EXE
          path: |
            dist/Panda PC Optimizer.exe
            dist/Panda PC Optimizer Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release with EXE and Installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Panda PC Optimizer v0.1.${{ github.run_number }}
          body: |
            Automated Windows build of Panda PC Optimizer.

            - **Recommended:** Download **Panda PC Optimizer Setup.exe** to install the app with Start Menu shortcuts and an optional desktop shortcut. It installs for the current Windows user and does not require administrator access.
            - **Portable option:** Download **Panda PC Optimizer.exe** to run without installing.
            Windows SmartScreen may show a warning because the app is not code-signed.
          files: |
            dist/Panda PC Optimizer.exe
            dist/Panda PC Optimizer Setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
