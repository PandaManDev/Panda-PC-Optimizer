name: Build and Release Panda PC Optimizer EXE and Installer

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Prepare Panda app icon
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import base64
          import io
          from PIL import Image
          tree = ast.parse(open("main.py", encoding="utf-8").read())
          value = next(node.value for node in tree.body
                       if isinstance(node, ast.Assign)
                       and any(isinstance(target, ast.Name) and target.id == "PANDA_LOGO_PNG_B64"
                               for target in node.targets))
          png = base64.b64decode(ast.literal_eval(value))
          image = Image.open(io.BytesIO(png)).convert("RGBA")
          image.save("panda_logo.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128)])
          PY
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon=panda_logo.ico --name "Panda PC Optimizer" main.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
      - name: Upload Windows builds as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Panda-PC-Optimizer-Windows-Installer-and-EXE
          path: |
            dist/Panda PC Optimizer.exe
            dist/Panda PC Optimizer Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release with EXE and Installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Panda PC Optimizer v0.1.${{ github.run_number }}
          body: |
            Automated Windows build of Panda PC Optimizer.

            - **Recommended:** Download **Panda PC Optimizer Setup.exe** to install the app with Start Menu shortcuts and an optional desktop shortcut. It installs for the current Windows user and does not require administrator access.
            - **Portable option:** Download **Panda PC Optimizer.exe** to run without installing.
            Windows SmartScreen may show a warning because the app is not code-signed.
          files: |
            dist/Panda PC Optimizer.exe
            dist/Panda PC Optimizer Setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
