name: Build and Release Panda PC Optimizer EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Panda PC Optimizer" main.py
      - name: Upload EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Panda-PC-Optimizer-Windows-EXE
          path: dist/Panda PC Optimizer.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release with EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Panda PC Optimizer v0.1.${{ github.run_number }}
          body: |
            Automated Windows executable build of Panda PC Optimizer.

            Download **Panda PC Optimizer.exe** below, save it to your Windows PC, and double-click to run.
            Windows SmartScreen may show a warning because this app is not code-signed.
          files: dist/Panda PC Optimizer.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
