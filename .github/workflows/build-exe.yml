name: Build Panda PC Optimizer EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Panda PC Optimizer" main.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Panda-PC-Optimizer-Windows-EXE
          path: dist/Panda PC Optimizer.exe
          if-no-files-found: error
          retention-days: 30
